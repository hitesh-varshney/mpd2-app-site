<style>
/* Layout: sticky search bar over a single reading column; tasks first, courses second.
   Color: graphite ink on cool paper, one teal-blue accent, amber reserved for conflicts. */
:root{
  --bg:#F3F6F8; --panel:#FFFFFF; --ink:#14212B; --mute:#556672; --line:#D3DCE2;
  --accent:#0A6C8B; --accent-ink:#FFFFFF; --accent-soft:#DDEEF4;
  --warn:#8F5200; --warn-soft:#FBEBD2; --ok:#2C6A3E; --ok-soft:#DDEFE2;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E161C; --panel:#15202A; --ink:#E5ECF0; --mute:#93A4B0; --line:#293845;
  --accent:#5CC3E0; --accent-ink:#06222B; --accent-soft:#173440;
  --warn:#EBB65E; --warn-soft:#382D15; --ok:#7CCB92; --ok-soft:#1A3324; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161C; --panel:#15202A; --ink:#E5ECF0; --mute:#93A4B0; --line:#293845;
  --accent:#5CC3E0; --accent-ink:#06222B; --accent-soft:#173440;
  --warn:#EBB65E; --warn-soft:#382D15; --ok:#7CCB92; --ok-soft:#1A3324; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:var(--fs,16px)/1.55 var(--sans);padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1000px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);
  margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0 calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.bar{max-width:1000px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font:600 17px/1 var(--serif);letter-spacing:.01em;white-space:nowrap;color:var(--ink)}
.brand small{font:500 11px var(--mono);color:var(--mute);margin-left:6px;letter-spacing:.04em}
.search{flex:1 1 280px;min-width:0;position:relative}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:6px;background:var(--bg);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--mute);fill:none;stroke-width:2}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 10px;cursor:pointer;font-size:13px}
.iconbtn:hover{border-color:var(--accent)}
nav.tabs{max-width:1000px;margin:8px auto 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
nav.tabs a{padding:6px 12px;border-radius:5px;color:var(--mute);font-size:13.5px;white-space:nowrap}
nav.tabs a.on,nav.tabs a:hover{background:var(--accent-soft);color:var(--accent);text-decoration:none}

h1{font:600 26px/1.2 var(--serif);margin:0 0 6px;text-wrap:balance}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

tr:last-child td{border-bottom:0}

.seg a:last-child{border-right:0}
.seg a.on{background:var(--accent);color:var(--accent-ink);text-decoration:none}
.ex{border-left:3px solid var(--accent);background:var(--panel);padding:10px 14px;margin:0 0 10px;border-radius:0 6px 6px 0}
.ex .eh{font:500 12px var(--mono);color:var(--mute);margin-bottom:4px;overflow-wrap:anywhere}
.crumb{font-size:13px;color:var(--mute);margin-bottom:10px}
.letters{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 14px}
.letters a{font:500 12px var(--mono);padding:3px 7px;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
.gl{padding:6px 0;border-bottom:1px solid var(--line)}
.gl b{font-weight:600}
.more{width:100%;padding:10px;border:1px dashed var(--line);background:transparent;border-radius:8px;color:var(--accent);cursor:pointer}
footer{color:var(--mute);font-size:12.5px;margin-top:40px;border-top:1px solid var(--line);padding-top:14px;max-width:75ch}
.empty{color:var(--mute);padding:30px 0}
@media (max-width:560px){h1{font-size:22px}.card{padding:16px}.brand small{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.iconbtn,.res,.tile,.seg a,.more,summary,#bnav a{min-height:44px}
.iconbtn{display:inline-flex;align-items:center}
.res{padding:14px}
.search input{font-size:16px;padding:12px 12px 12px 38px}
.usewhen{background:var(--accent-soft);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:.95em}
.favbtn{float:right;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;min-height:40px;color:var(--ink)}
.favbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
details.fold{border-top:1px solid var(--line);padding:2px 0}
details.fold>summary{cursor:pointer;font:600 16px var(--serif);padding:12px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font:500 20px var(--mono);color:var(--mute)}
details.fold[open]>summary::after{content:"-"}
details.fold>*:not(summary){margin-bottom:8px}
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#bnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--mute);text-decoration:none;padding:6px 0}
#bnav a.on{color:var(--accent);font-weight:600}
#bnav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;margin-bottom:2px}
nav.tabs{display:none}
@media (max-width:899px){#theme{display:none}.bar{gap:6px}.brand{font-size:15px}header.top{padding-top:6px;padding-bottom:6px}.search{flex:1 1 100%}.lede{font-size:.95em}}
details.fold>p:first-of-type,details.fold>ul:first-of-type,details.fold>ol:first-of-type{margin-top:0}
@media (min-width:900px){#bnav{display:none}body{padding-bottom:0}nav.tabs{display:flex}}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#lock form{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px}
#lock input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px;margin:10px 0}
#lock button{width:100%;padding:12px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px}
#lockmsg{color:var(--warn);min-height:1.4em;font-size:14px}
</style></head><body>
<div id="lock"><form id="lockform"><h1 style="font:600 22px Georgia,serif;margin:0 0 4px">MPD² Field Reference</h1><div style="color:var(--mute);font-size:14px">Enter your passphrase. It is asked once per device.</div>
<input id="pass" type="password" autocomplete="current-password" placeholder="Passphrase" aria-label="Passphrase"><div id="lockmsg"></div><button type="submit">Unlock</button></form></div>
<header class="top"><div class="bar"><a class="brand" href="#home">MPD² Field Reference<small>va184d9b0</small></a>
<label class="search" for="q"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
<input id="q" type="search" placeholder="Search: willingness to pay, RICE, CAC" autocomplete="off" aria-label="Search the reference"></label>

<script>
window.startApp=function(D){
var main=document.getElementById('main'),q=document.getElementById('q');
var byId={},byTask={},bySub={},exBy={},tasksBy={};
D.cards.forEach(function(c){byId[c.id]=c;(byTask[c.k]=byTask[c.k]||[]).push(c);(bySub[c.s]=bySub[c.s]||[]).push(c);});
D.ex.forEach(function(e){(exBy[e.cn]=exBy[e.cn]||[]).push(e);});
D.tasks.forEach(function(t){tasksBy[t.slug]=t;});
var COURSES={};D.courses.forEach(function(c){COURSES[c.code]=c;});
var ROLE={concept:'concept',template:'template',reference:'reference'};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function nice(s){return s.replace(/-/g,' ');}
function subName(s){return nice(s.split('/')[1]||s);}
var idRe=/[a-z0-9]+(?:-[a-z0-9]+)+|[a-z0-9]{4,}/g;
function linkIds(html){
  return html.replace(/\[([a-z0-9][a-z0-9-]*)\]/g,function(m,id){return byId[id]?'<a href="#c-'+id+'">'+esc(byId[id].t)+'</a>':m;});
}
function linkRelated(text){
  return esc(text).replace(idRe,function(w){return byId[w]?'<a href="#c-'+w+'">'+esc(byId[w].t)+'</a>':w;});
}
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/(^|[\s(])\*([^*\s][^*]*)\*(?=[\s).,;:]|$)/g,'$1<i>$2</i>');
  return s;
}
function md(src,opts){
  opts=opts||{};var out=[],lines=src.replace(/\r/g,'').split('\n'),i=0;
  function related(h){return /^related$/i.test(h);}
  var inRelated=false;
  while(i<lines.length){
    var l=lines[i];
    if(!l.trim()){i++;continue;}
    var h=l.match(/^(#{1,4})\s+(.*)$/);
    if(h){var lv=Math.min(h[1].length+(opts.shift||0),4);inRelated=related(h[2].trim());out.push('<h'+lv+'>'+inline(h[2])+'</h'+lv+'>');i++;continue;}
    if(/^\|/.test(l)&&lines[i+1]&&/^\|[\s:|-]+\|?\s*$/.test(lines[i+1])){
      var rows=[];while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i]);i++;}
      var cells=function(r){return r.replace(/^\||\|\s*$/g,'').split('|').map(function(x){return x.trim();});};
      var hd=cells(rows[0]),t='<div class="tablewrap"><table><thead><tr>'+hd.map(function(x){return '<th>'+inline(x)+'</th>';}).join('')+'</tr></thead><tbody>';
      for(var r=2;r<rows.length;r++){t+='<tr>'+cells(rows[r]).map(function(x){return '<td>'+linkIds(inline(x))+'</td>';}).join('')+'</tr>';}
      out.push(t+'</tbody></table></div>');continue;}
    if(/^\s*([-*]|\d+[.)])\s+/.test(l)){
      var ord=/^\s*\d+[.)]/.test(l),items=[];
      while(i<lines.length&&/^\s*([-*]|\d+[.)])\s+/.test(lines[i])){
        var it=lines[i].replace(/^\s*([-*]|\d+[.)])\s+/,'');i++;
        while(i<lines.length&&lines[i].trim()&&/^\s{2,}\S/.test(lines[i])&&!/^\s*([-*]|\d+[.)])\s+/.test(lines[i])){it+=' '+lines[i].trim();i++;}
        items.push(it);}
      var tag=ord?'ol':'ul';
      out.push('<'+tag+'>'+items.map(function(x){return '<li>'+(inRelated?linkRelated(x):linkIds(inline(x)))+'</li>';}).join('')+'</'+tag+'>');continue;}
    var p=[l];i++;
    while(i<lines.length&&lines[i].trim()&&!/^(#{1,4}\s|\||\s*([-*]|\d+[.)])\s)/.test(lines[i])){p.push(lines[i]);i++;}
    var txt=p.join(' ');
    out.push('<p>'+(inRelated?linkRelated(txt):linkIds(inline(txt)))+'</p>');
  }
  return out.join('\n');
}
/* ---------- search ---------- */
function tok(s){return s.toLowerCase().replace(/[^a-z0-9\s-]/g,' ').split(/[\s-]+/).filter(function(x){return x.length>1;});}
D.cards.forEach(function(c){
  c._t=c.t.toLowerCase();c._a=c.a.join(' | ').toLowerCase();c._id=c.id.replace(/-/g,' ');
  c._b=c.b.toLowerCase();c._s=(c.s+' '+c.k).replace(/-/g,' ').toLowerCase();});
function score(c,terms,phrase){
  var s=0,i,t;
  if(c._t===phrase)s+=60;else if(c._t.indexOf(phrase)===0)s+=34;else if(c._t.indexOf(phrase)>-1)s+=24;
  if(c._a.indexOf(phrase)>-1)s+=20;if(c._id.indexOf(phrase)>-1)s+=14;
  for(i=0;i<terms.length;i++){t=terms[i];var hit=0;
    if(c._t.indexOf(t)>-1){s+=9;hit=1;}
    if(c._a.indexOf(t)>-1){s+=6;hit=1;}
    if(c._id.indexOf(t)>-1){s+=4;hit=1;}
    if(c._s.indexOf(t)>-1){s+=2;hit=1;}
    var n=0,p=-1;while(n<6&&(p=c._b.indexOf(t,p+1))>-1)n++;
    if(n){s+=Math.min(n,6)*0.8;hit=1;}
    if(!hit)return 0;}
  if(c.r==='reference')s*=0.8;
  return s;
}
function near(a,b){if(a===b)return true;if(a.length<4||Math.abs(a.length-b.length)>1)return false;var i=0,j=0,d=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue;}d++;if(d>1)return false;if(a.length>b.length)i++;else if(a.length<b.length)j++;else{i++;j++;}}return d+(a.length-i)+(b.length-j)<=1;}
var F={task:'',course:'',role:'',conflict:false},shown=40,lastQuery='';
function runSearch(){
  var query=q.value.trim();lastQuery=query;
  var terms=tok(query),phrase=query.toLowerCase().replace(/\s+/g,' ');
  var list=D.cards.filter(function(c){
    return (!F.task||c.k===F.task)&&(!F.course||c.c.indexOf(F.course)>-1)&&(!F.role||c.r===F.role)&&(!F.conflict||c.x);});
  var res;
  if(terms.length){res=[];list.forEach(function(c){var s=score(c,terms,phrase);if(s>0)res.push([s,c]);});res.sort(function(a,b){return b[0]-a[0]||(a[1].t<b[1].t?-1:1);});res=res.map(function(x){return x[1];});}
  else res=list.slice().sort(function(a,b){return a.t<b.t?-1:1;});
  if(terms.length&&!res.length){res=[];list.forEach(function(c){var tk=tok(c.t+' '+c.a.join(' '));var ok=terms.every(function(t){return tk.some(function(w){return near(t,w);});});if(ok)res.push(c);});}
  return res;
}
function badges(c){
  var h='<span class="chip">'+esc(nice(c.k))+'</span>';
  c.c.forEach(function(x){h+='<span class="chip course">'+x+'</span>';});
  if(c.x)h+='<span class="chip warn">versions differ</span>';
  if(c.q==='low')h+='<span class="chip low">low confidence</span>';
  if(c.r!=='concept')h+='<span class="chip course">'+ROLE[c.r]+'</span>';
  return h;
}
function first(c){if(c.w)return c.w;
  var m=c.b.match(/## What it is\s*\n([\s\S]*?)(?=\n## |$)/);var t=m?m[1].trim().replace(/\s+/g,' '):'';
  return t.length>190?t.slice(0,187)+'...':t;}
function resultItem(c){
  return '<a class="res" href="#c-'+c.id+'"><div class="t">'+esc(c.t)+'</div><div class="s">'+esc(first(c))+'</div><div class="meta">'+badges(c)+'<span class="chip course">'+esc(subName(c.s))+'</span></div></a>';}
function filtersHtml(){
  var to='<option value="">All work tasks</option>'+D.tasks.map(function(t){return '<option value="'+t.slug+'"'+(F.task===t.slug?' selected':'')+'>'+esc(t.title)+'</option>';}).join('');

r marked low confidence. Check the book before quoting a number from those five. A few Value Proposition Design cards come from Strategyzer web pages rather than the book and carry low or medium confidence. Customer-interview transcripts from the capstone are summarized in Worked examples (codes only, no names); sprint counts were re-verified against the transcripts, with two marked unsettled.</p></div>';}

(function(){
var ITER=200000;
function b64(buf){var s='',a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function idb(){return new Promise(function(res,rej){var r=indexedDB.open('mpd2',1);r.onupgradeneeded=function(){r.result.createObjectStore('k');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function idbGet(k){return idb().then(function(db){return new Promise(function(res){var q=db.transaction('k').objectStore('k').get(k);q.onsuccess=function(){res(q.result);};q.onerror=function(){res(null);};});}).catch(function(){return null;});}
function idbSet(k,v){return idb().then(function(db){return new Promise(function(res){var t=db.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=res;t.onerror=res;});}).catch(function(){});}
function idbDel(k){return idb().then(function(db){return new Promise(function(res){var t=db.transaction('k','readwrite');t.objectStore('k').delete(k);t.oncomplete=res;t.onerror=res;});}).catch(function(){});}
async function deriveKey(pass,salt,extractable){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},extractable,['decrypt']);}
async function decrypt(buf,key){
  var u=new Uint8Array(buf),iv=u.slice(20,32),ct=u.slice(32);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv,additionalData:new TextEncoder().encode('MPD2')},key,ct);
  var ds=new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip')));
  return JSON.parse(await ds.text());}
async function getBuf(){
  try{var r=await fetch('data.enc',{cache:'no-cache'});if(r.ok)return await r.arrayBuffer();}catch(e){}
  var c=await caches.match('data.enc');if(c)return await c.arrayBuffer();
  throw new Error('offline and not cached yet');}
var lock=document.getElementById('lock'),msg=document.getElementById('lockmsg');
async function boot(pass){
  var buf=await getBuf(),u=new Uint8Array(buf),salt=u.slice(4,20),key=null;
  var saved=await idbGet('key');
  if(!pass&&saved&&b64(saved.salt)===b64(salt)){try{var d0=await decrypt(buf,saved.key);lock.remove();window.startApp(d0);return true;}catch(e){await idbDel('key');}}
  if(!pass)return false;
  key=await deriveKey(pass,salt,false);
  var d=await decrypt(buf,key);
  await idbSet('key',{key:key,salt:salt});
  lock.remove();window.startApp(d);return true;}
