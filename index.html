<html lang="en"><head><meta charset="utf-8">

<title>MPD² Field Reference</title>

<meta name="robots" content="noindex,nofollow">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
/* A pocket engineering handbook: drafting-vellum paper, ink, one drafting-green accent.
   Redline is reserved for markups: places where courses disagree and pitfalls.
   UI and headings in a condensed technical sans; reading text in a book serif. */
@font-face{font-family:Plex;src:url(ibm-plex-sans-condensed-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Plex;src:url(ibm-plex-sans-condensed-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:Plex;src:url(ibm-plex-sans-condensed-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:Plex;src:url(ibm-plex-sans-condensed-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:Serif4;src:url(source-serif-4-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Serif4;src:url(source-serif-4-latin-400-italic.woff2) format('woff2');font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:Serif4;src:url(source-serif-4-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
:root{
  --bg:#EDEFE9; --paper:#FAFAF6; --ink:#18201C; --mute:#5B665F; --rule:#CBD1C7;
  --green:#1E5B4B; --green-soft:#DDE8E1; --red:#B3352B; --red-soft:#F5E1DD;
  --ui:Plex,"Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --read:Serif4,Georgia,"Times New Roman",serif;
  --fs:17px; --nav:60px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141A17; --paper:#1B221E; --ink:#E3E8E2; --mute:#9BA69F; --rule:#2F3833;
  --green:#7FC4A9; --green-soft:#21332B; --red:#F08B7F; --red-soft:#3A2420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A17; --paper:#1B221E; --ink:#E3E8E2; --mute:#9BA69F; --rule:#2F3833;
  --green:#7FC4A9; --green-soft:#21332B; --red:#F08B7F; --red-soft:#3A2420; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.6 var(--read);
  padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom,0px) + 24px)}
a{color:var(--green);text-decoration:none}
a:focus-visible,button:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:4px}
button,input,select{font:inherit;color:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* top bar */
#bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;min-height:52px;
  padding:calc(env(safe-area-inset-top,0px) + 4px) 8px 4px 16px;background:var(--bg);border-bottom:1px solid var(--rule)}
.brand{font:600 17px/1 var(--ui);color:var(--ink);letter-spacing:.01em}
.grow{flex:1}
.bt{flex:1;min-width:0;font:500 15px/1.2 var(--ui);color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:none;border-radius:8px;color:var(--ink);cursor:pointer;margin-left:-8px}
.ib:last-child{margin-left:auto}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

main{max-width:720px;margin:0 auto;padding:18px 16px 0}
h1{font:600 30px/1.12 var(--ui);letter-spacing:-.005em;margin:6px 0 8px;text-wrap:balance}
h2,h3,h4{font-family:var(--ui)}
.lede{color:var(--mute);margin:0 0 18px}
.hint{color:var(--mute);font:400 15px/1.5 var(--ui);margin:10px 0}
h2.lane{font:600 15px/1.2 var(--ui);color:var(--mute);margin:30px 0 10px;letter-spacing:.01em}

/* home */
.hero h1{font-size:34px;margin:10px 0 14px}
.fakesearch{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;border:1.5px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--mute);font:400 17px var(--ui)}
.fakesearch svg,.sbox svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;flex:none}
.today{margin-top:22px;border:1.5px solid var(--ink);border-radius:10px;background:var(--paper);overflow:hidden}
.tbh{display:flex;justify-content:space-between;padding:7px 14px;border-bottom:1px solid var(--rule);font:500 13px var(--ui);color:var(--mute)}
.tbb{display:block;padding:14px 14px 16px;color:var(--ink)}
.tt{display:block;font:600 24px/1.15 var(--ui);margin-bottom:6px}
.tw{display:block;color:var(--ink)}
.today .list.flat{border:0;border-top:1px solid var(--rule);border-radius:0}
.tl{display:block;margin-top:10px;font:500 14px var(--ui);color:var(--green)}
.tasks{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.task{display:flex;flex-direction:column;justify-content:space-between;gap:6px;min-height:76px;padding:11px 12px;background:var(--paper);color:var(--ink);font:500 15.5px/1.25 var(--ui)}
.task small{font:400 13px var(--ui);color:var(--mute)}
.task:active,.row:active{background:var(--green-soft)}
.courses{display:flex;flex-wrap:wrap;gap:8px}
.courses a,.cc{display:inline-flex;align-items:center;min-height:32px;padding:0 10px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);font:500 14px var(--ui);color:var(--ink)}
.courses a{min-height:40px}

/* lists */
.list{border:1px solid var(--rule);border-radius:10px;overflow:hidden;background:var(--rule);display:grid;gap:1px}
.row{display:block;padding:12px 14px;background:var(--paper);color:var(--ink)}
.rt{display:block;font:600 17px/1.25 var(--ui)}
.rb{display:block;margin-top:3px;font:400 15px/1.45 var(--read);color:var(--ink);opacity:.85}
.rm{display:block;margin-top:6px;font:400 13px var(--ui);color:var(--mute)}
.mk{font-style:normal;color:var(--red)} .kd{font-style:normal}
.ctag{display:inline-block;font:600 12.5px/1.6 var(--ui);padding:0 6px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--mute);vertical-align:1px}
.more{display:block;width:100%;min-height:48px;margin:12px 0;border:1px solid var(--rule);border-radius:10px;background:var(--paper);font:500 15px var(--ui);cursor:pointer}

/* search */
.sbox{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border:1.5px solid var(--ink);border-radius:10px;background:var(--paper)}
.sbox input{flex:1;min-width:0;border:0;outline:0;background:none;font:400 18px var(--ui);padding:12px 0}
.filters{display:flex;gap:8px;margin:10px 0 4px;overflow-x:auto;scrollbar-width:none}
.filters select{flex:none;min-height:40px;max-width:60vw;padding:0 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);font:400 14.5px var(--ui)}
.count{font:500 14px var(--ui);color:var(--mute);margin:14px 0 8px}
.recent{display:flex;flex-wrap:wrap;gap:8px}
.recent button{min-height:40px;padding:0 12px;border:1px solid var(--rule);border-radius:20px;background:var(--paper);font:400 15px var(--ui);cursor:pointer}

/* task */
.seg{display:flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;margin:4px 0 14px}
.seg a{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;min-height:44px;padding:4px 6px;font:500 14.5px/1.15 var(--ui);color:var(--ink);border-left:1px solid var(--rule)}
.seg a:first-child{border-left:0}
.seg a.on{background:var(--ink);color:var(--paper)}
.choose{display:grid;gap:10px}
.ch{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.sit{margin:0 0 8px;font:400 16px/1.45 var(--read)}
.go{display:flex;flex-wrap:wrap;gap:8px}
.start{display:inline-flex;align-items:center;min-height:40px;padding:0 12px;border-radius:8px;background:var(--green);color:var(--paper);font:600 15px/1.2 var(--ui)}
.then{margin:8px 0 0;font:400 14.5px/1.5 var(--ui);color:var(--mute)}
details.sub{border:1px solid var(--rule);border-radius:10px;background:var(--paper);margin:0 0 8px;overflow:hidden}
details.sub>summary{list-style:none;display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px;cursor:pointer;min-height:48px}
details.sub>summary::-webkit-details-marker{display:none}
.st{font:600 17px/1.25 var(--ui)} .sd{grid-column:1;font:400 14.5px/1.4 var(--ui);color:var(--mute)}
.sn{grid-row:1;grid-column:2;font:500 14px var(--ui);color:var(--mute);align-self:start}
details.sub[open]>summary{border-bottom:1px solid var(--rule)}
details.sub .list{border:0;border-radius:0}
details.sub .ex{margin:0;border:0;border-bottom:1px solid var(--rule);border-radius:0}

/* card */
.crumb{font:400 14px/1.4 var(--ui);color:var(--mute)}
.ct{font-size:32px;margin-top:8px}
.tblock{margin:12px 0 16px;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--paper)}
.tblock>div{display:grid;grid-template-columns:96px 1fr;border-top:1px solid var(--rule)}
.tblock>div:first-child{border-top:0}
.tblock dt{padding:8px 10px;font:500 13px/1.4 var(--ui);color:var(--mute);border-right:1px solid var(--rule)}
.tblock dd{margin:0;padding:6px 10px;font:400 15px/1.45 var(--ui);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tblock .cc{min-height:30px;font-size:13.5px}
.tblock .red dt{color:var(--red)} .tblock .red dd{color:var(--red)}
.usew{font-size:1.06em;margin:0 0 14px}
.usew b,.watch b{font:600 .88em var(--ui);margin-right:4px}
.steps{list-style:none;counter-reset:s;padding:0;margin:0 0 14px;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:6px;align-items:start}
.steps li::before{content:counter(s);font:700 20px/1.3 var(--ui);color:var(--green)}
.watch{margin:0 0 16px;padding:10px 12px;border-left:3px solid var(--red);background:var(--red-soft);border-radius:0 8px 8px 0;font-size:.97em}
.watch b{color:var(--red)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border:1.5px solid var(--ink);border-radius:8px;background:var(--paper);font:600 15px var(--ui);cursor:pointer}
.btn.on{background:var(--ink);color:var(--paper)}
.lens{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;margin:0 0 10px;padding-bottom:2px}
.lens span{font:500 13px var(--ui);color:var(--mute);flex:none}
.lens button{flex:none;min-height:36px;padding:0 10px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);font:500 13.5px var(--ui);cursor:pointer}
.lens button.on{background:var(--green);border-color:var(--green);color:var(--paper)}
.lensed .dim{display:none}
details.fold{border-top:1px solid var(--rule)}
details.fold:last-child{border-bottom:1px solid var(--rule)}
details.fold>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:48px;font:600 17px var(--ui);cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after,details.src>summary::after,details.exs>summary::after{content:"+";font:400 22px var(--ui);color:var(--mute)}
details.fold[open]>summary::after,details.src[open]>summary::after,details.exs[open]>summary::after{content:"\2212"}
.prose{overflow-wrap:break-word}
.prose p{margin:0 0 12px} .prose ul,.prose ol{margin:0 0 12px;padding-left:22px} .prose li{margin:0 0 6px}
.prose h3,.prose h4{font:600 16px var(--ui);margin:16px 0 6px}
.prose code{font:14px ui-monospace,Menlo,Consolas,monospace;background:var(--green-soft);padding:1px 4px;border-radius:3px}
.tablewrap{overflow-x:auto;margin:0 0 14px;border:1px solid var(--rule);border-radius:8px}
table{border-collapse:collapse;font:400 14.5px/1.4 var(--ui);min-width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
th{background:var(--bg);font-weight:600}
.rel{display:flex;flex-wrap:wrap;gap:8px}
.rel a{display:inline-flex;align-items:center;min-height:40px;padding:4px 12px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);font:500 15px/1.25 var(--ui)}
.ex{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;margin:0 0 10px}
.exh{font:400 14.5px/1.5 var(--ui);margin-bottom:6px} .exh b{font-weight:600}
.exh .cc{min-height:24px;font-size:12.5px;padding:0 6px} .exc{color:var(--mute)}
.ex .prose{font-size:.95em}
details.src,details.exs{margin:14px 0 0;border-top:1px solid var(--rule)}
details.src>summary,details.exs>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:46px;font:500 15px var(--ui);color:var(--mute);cursor:pointer}
details.src>summary::-webkit-details-marker,details.exs>summary::-webkit-details-marker{display:none}
details.src ul{font:400 14px/1.45 var(--ui);color:var(--mute);padding-left:18px}
details.src p{font:400 14.5px/1.5 var(--ui);color:var(--mute)}
details.exs .ex{margin-top:6px}

/* glossary + settings */
.az{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 14px}
.az a{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:6px;font:600 15px var(--ui);color:var(--ink)}
.az a.on{background:var(--ink);color:var(--paper)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px;border-bottom:1px solid var(--rule);font:500 16px var(--ui)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{min-width:44px;min-height:40px;padding:0 10px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);font:500 14.5px var(--ui);cursor:pointer}
.stepper output{min-width:46px;text-align:center;font:500 15px var(--ui)}
.course h2{font:600 18px var(--ui);margin:22px 0 8px}

/* bottom nav */
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--paper);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
#bnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--nav);font:500 12.5px var(--ui);color:var(--mute)}
#bnav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#bnav a.on{color:var(--green)} #bnav a.on svg{stroke-width:2.4}

/* learning */
.learn{margin:4px 0 16px;padding:12px 14px;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
.lq{margin:0 0 10px;font:600 15.5px var(--ui)} .ls{margin:8px 0 0;font:400 14px var(--ui);color:var(--mute)} .ls:empty{display:none}
.btn.wide{display:flex;align-items:center;justify-content:center;width:100%;color:var(--ink)}
a.btn.wide{background:var(--ink);color:var(--paper);margin:6px 0}
.revcta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--green);color:var(--paper)}
.revcta b{display:block;font:600 17px var(--ui)} .revcta small{display:block;font:400 14px var(--ui);opacity:.85}
.go2{font:600 15px var(--ui);padding:8px 14px;border:1.5px solid currentColor;border-radius:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--paper);margin:6px 0 12px}
.stats div{padding:10px 12px;border-left:1px solid var(--rule)} .stats div:first-child{border-left:0}
.stats b{display:block;font:600 26px/1.1 var(--ui)} .stats span{font:400 13.5px var(--ui);color:var(--mute)}
.prog{display:grid;gap:10px}
.pr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font:400 14.5px var(--ui)}
.pc{color:var(--mute)} .pb{grid-column:1/3;position:relative;height:8px;border-radius:4px;background:var(--rule);overflow:hidden}
.pb i{position:absolute;left:0;top:0;bottom:0;background:var(--green-soft);border-right:0} .pb i.k{background:var(--green)}
.flash{padding:16px;border:1.5px solid var(--ink);border-radius:10px;background:var(--paper);margin-bottom:12px}
.fq{margin:0 0 6px;font:500 14px var(--ui);color:var(--mute)} .flash .ct{margin:0 0 4px}
.rv .btn{flex:1}
.bw{position:relative;display:inline-flex}
#duebadge{position:absolute;top:-4px;right:-10px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font:600 11px/18px var(--ui);text-align:center}

/* lock */
#lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#lockform{width:100%;max-width:360px}
#lockform h1{font-size:30px}
#lockform p{font:400 15px/1.5 var(--ui);color:var(--mute);margin:0 0 16px}
#lockform input[type=password]{width:100%;min-height:52px;padding:0 14px;border:1.5px solid var(--ink);border-radius:10px;background:var(--paper);font:400 18px var(--ui)}
#lockform button{width:100%;min-height:52px;margin-top:12px;border:0;border-radius:10px;background:var(--green);color:var(--paper);font:600 17px var(--ui);cursor:pointer}
#lockmsg{min-height:22px;margin-top:8px;font:500 15px var(--ui);color:var(--red)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (min-width:760px){.tasks{grid-template-columns:1fr 1fr 1fr}h1{font-size:34px}.ct{font-size:38px}}
</style></head><body>
<div id="lock"><form id="lockform" autocomplete="on"><h1>MPD² Field Reference</h1><p>Enter the passphrase. This device remembers it after the first time.</p>
<input class="vh" type="text" name="username" autocomplete="username" value="mpd2" tabindex="-1" aria-hidden="true" readonly>
<label class="vh" for="pass">Passphrase</label><input id="pass" name="password" type="password" autocomplete="current-password" placeholder="Passphrase">
<div id="lockmsg" role="alert"></div><button type="submit">Unlock</button></form></div>
<header id="bar"></header>
<main id="main"></main>
<nav id="bnav" aria-label="Main">
<a href="#home" data-n="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Home</a>
<a href="#search" data-n="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Search</a>
<a href="#tasks" data-n="tasks"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Tasks</a>
<a href="#saved" data-n="saved"><span class="bw"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 4h11a2 2 0 0 1 2 2v11"/></svg><b id="duebadge" style="display:none"></b></span>Library</a>
<a href="#more" data-n="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</a></nav>
<script>
window.APPVER='e2442f61';
window.startApp=function(D){
'use strict';
var main=document.getElementById('main'),bar=document.getElementById('bar');
var byId={},bySub={},byTask={},exBy={},exTask={},T={},CO={};
D.cards.forEach(function(c){byId[c.id]=c;(bySub[c.s]=bySub[c.s]||[]).push(c);(byTask[c.k]=byTask[c.k]||[]).push(c);});
D.ex.forEach(function(e){(exBy[e.cn]=exBy[e.cn]||[]).push(e);(e.cs||[]).forEach(function(id){(exBy[id]=exBy[id]||[]).push(e);});var k=(e.s||'').split('/')[0];(exTask[k]=exTask[k]||[]).push(e);});
D.tasks.forEach(function(t){T[t.slug]=t;});
D.courses.forEach(function(c){CO[c.code]=c;});

/* ---------- storage ---------- */
function lsGet(k,d){try{var v=localStorage.getItem('mpd2.'+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem('mpd2.'+k,JSON.stringify(v));}catch(e){}}
function favs(){return lsGet('favs',[]);}
function isFav(id){return favs().indexOf(id)>-1;}
function toggleFav(id){var f=favs(),i=f.indexOf(id);if(i>-1)f.splice(i,1);else f.unshift(id);lsSet('favs',f);return i<0;}
function pushRecent(id){var r=lsGet('recent',[]).filter(function(x){return x!==id;});r.unshift(id);lsSet('recent',r.slice(0,30));}
/* spaced review: box 0..5, intervals in days */
var GAPS=[1,3,7,16,35,90];
function dayAdd(n){var d=new Date(Date.parse(chicagoDate()+'T12:00:00Z')+n*864e5);return d.toISOString().slice(0,10);}
function deck(){return lsGet('deck',{});}
function inDeck(id){return !!deck()[id];}
function mark(id,knew){var d=deck(),e=d[id]||{b:-1};e.b=knew?Math.min(Math.max(e.b,0)+1,5):0;e.due=dayAdd(GAPS[Math.max(e.b,0)]);e.last=chicagoDate();d[id]=e;lsSet('deck',d);return e;}
function addDeck(id){var d=deck();if(!d[id]){d[id]={b:-1,due:dayAdd(1),last:''};lsSet('deck',d);}}
function dueList(){var d=deck(),t=chicagoDate();return Object.keys(d).filter(function(id){return byId[id]&&d[id].due<=t;}).sort(function(a,b){return d[a].due<d[b].due?-1:1;});}
function nextDue(){var d=deck(),k=Object.keys(d).map(function(id){return d[id].due;}).sort();return k[0]||chicagoDate();}
function badge(){var n=dueList().length,el=document.getElementById('duebadge');if(el){el.textContent=n||'';el.style.display=n?'':'none';}}
function stateText(e){if(!e)return '';if(e.b>=4)return 'Known well';if(e.b<=0)return 'Learning, next review '+fmtDay(e.due);return 'Next review '+fmtDay(e.due);}
function fmtDay(s){var t=chicagoDate();if(s<=t)return 'today';if(s===dayAdd(1))return 'tomorrow';var d=new Date(s+'T12:00:00Z');return d.toLocaleDateString(undefined,{month:'short',day:'numeric',timeZone:'UTC'});}
function pushSearch(s){s=s.trim();if(s.length<3)return;var r=lsGet('searches',[]).filter(function(x){return x.toLowerCase()!==s.toLowerCase();});r.unshift(s);lsSet('searches',r.slice(0,8));}

/* ---------- text helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function nice(s){return String(s).replace(/-/g,' ');}
function cap(s){s=nice(s);return s.charAt(0).toUpperCase()+s.slice(1);}
function subName(s){return cap(s.split('/')[1]||s);}
function courseName(code){var c=CO[code];if(!c)return code;return c.title.replace(new RegExp('^'+code+'\\s*'),'')||code;}
function plural(n,w){return n+' '+w+(n===1?'':'s');}
var idRe=/[a-z0-9]+(?:-[a-z0-9]+)+|[a-z0-9]{4,}/g;
function cardLink(id){var c=byId[id];return c?'<a href="#c-'+id+'">'+esc(c.t)+'</a>':esc(nice(id));}
function linkIds(html){return html.replace(/\[([a-z0-9][a-z0-9-]*)\]/g,function(m,id){return byId[id]?cardLink(id):m;});}
function linkWords(text){return esc(text).replace(idRe,function(w){return byId[w]?cardLink(w):w;});}
function inline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/(^|[\s(])\*([^*\s][^*]*)\*(?=[\s).,;:]|$)/g,'$1<i>$2</i>');
  return linkIds(s);
}
var lensRe=/^\(((?:[A-Z][A-Za-z]*-?\d*[A-Za-z]*)(?:\s*[,/]\s*[A-Z][A-Za-z]*-?\d*[A-Za-z]*)*)\)/;
function lensAttr(raw){var m=raw.match(lensRe);if(!m)return '';var cs=m[1].split(/\s*[,/]\s*/).filter(function(x){return CO[x];});return cs.length?' data-co="'+cs.join(' ')+'"':'';}
function ctag(raw){var m=raw.match(lensRe);if(!m||!lensAttr(raw))return inline(raw);return '<span class="ctag">'+esc(m[1])+'</span> '+inline(raw.slice(m[0].length).trim());}
function md(src,opts){
  opts=opts||{};var out=[],lines=String(src).replace(/\r/g,'').split('\n'),i=0,inRel=false;
  while(i<lines.length){
    var l=lines[i];
    if(!l.trim()){i++;continue;}
    var h=l.match(/^(#{1,4})\s+(.*)$/);
    if(h){var lv=Math.min(h[1].length+(opts.shift||0),4);inRel=/^related$/i.test(h[2].trim());out.push('<h'+lv+'>'+inline(h[2])+'</h'+lv+'>');i++;continue;}
    if(/^\|/.test(l)&&lines[i+1]&&/^\|[\s:|-]+\|?\s*$/.test(lines[i+1])){
      var rows=[];while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i]);i++;}
      var cells=function(r){return r.replace(/^\||\|\s*$/g,'').split('|').map(function(x){return x.trim();});};
      var t='<div class="tablewrap"><table><thead><tr>'+cells(rows[0]).map(function(x){return '<th>'+inline(x)+'</th>';}).join('')+'</tr></thead><tbody>';
      for(var r=2;r<rows.length;r++)t+='<tr>'+cells(rows[r]).map(function(x){return '<td>'+inline(x)+'</td>';}).join('')+'</tr>';
      out.push(t+'</tbody></table></div>');continue;}
    if(/^\s*([-*]|\d+[.)])\s+/.test(l)){
      var ord=/^\s*\d+[.)]/.test(l),its=[];
      while(i<lines.length&&/^\s*([-*]|\d+[.)])\s+/.test(lines[i])){
        var it=lines[i].replace(/^\s*([-*]|\d+[.)])\s+/,'');i++;
        while(i<lines.length&&lines[i].trim()&&/^\s{2,}\S/.test(lines[i])&&!/^\s*([-*]|\d+[.)])\s+/.test(lines[i])){it+=' '+lines[i].trim();i++;}
        its.push(it);}
      var tag=ord?'ol':'ul';
      out.push('<'+tag+'>'+its.map(function(x){return '<li'+lensAttr(x)+'>'+(inRel?linkWords(x):ctag(x))+'</li>';}).join('')+'</'+tag+'>');continue;}
    var p=[l];i++;
    while(i<lines.length&&lines[i].trim()&&!/^(#{1,4}\s|\||\s*([-*]|\d+[.)])\s)/.test(lines[i])){p.push(lines[i]);i++;}
    var txt=p.join(' ');
    out.push('<p'+lensAttr(txt)+'>'+(inRel?linkWords(txt):ctag(txt))+'</p>');
  }
  return out.join('\n');
}
function sections(b){
  var parts=[],re=/^## (.+)$/gm,m,idx=[];
  while((m=re.exec(b)))idx.push([m.index,m[1].trim(),re.lastIndex]);
  for(var i=0;i<idx.length;i++)parts.push({h:idx[i][1],body:b.slice(idx[i][2],i+1<idx.length?idx[i+1][0]:b.length).trim()});
  return parts;
}

/* ---------- today ---------- */
function chicagoDate(){try{return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chicago'}).format(new Date());}catch(e){return new Date().toISOString().slice(0,10);}}
function today(){
  var e=D.cal&&D.cal[chicagoDate()];if(!e)return null;
  if(e[1])return byId[e[1]]?{n:e[0],c:byId[e[1]]}:null;
  return {n:e[0],review:(e[2]||[]).filter(function(id){return byId[id];})};
}

/* ---------- search ---------- */
function tok(s){return s.toLowerCase().replace(/[^a-z0-9\s-]/g,' ').split(/[\s-]+/).filter(function(x){return x.length>1;});}
D.cards.forEach(function(c){c._t=c.t.toLowerCase();c._a=c.a.join(' | ').toLowerCase();c._id=c.id.replace(/-/g,' ');c._b=c.b.toLowerCase();c._s=(c.s+' '+c.k).replace(/[-/]/g,' ').toLowerCase();});
D.ex.forEach(function(e){e._x=((e.n||'')+' '+(e.p||'')+' '+(e.b||'')).toLowerCase().replace(/-/g,' ');});
function score(c,terms,phrase){
  var s=0;
  if(c._t===phrase)s+=60;else if(c._t.indexOf(phrase)===0)s+=34;else if(c._t.indexOf(phrase)>-1)s+=24;
  if(c._a.indexOf(phrase)>-1)s+=20;if(c._id.indexOf(phrase)>-1)s+=14;
  for(var i=0;i<terms.length;i++){var t=terms[i],hit=0;
    if(c._t.indexOf(t)>-1){s+=9;hit=1;}
    if(c._a.indexOf(t)>-1){s+=6;hit=1;}
    if(c._id.indexOf(t)>-1){s+=4;hit=1;}
    if(c._s.indexOf(t)>-1){s+=2;hit=1;}
    var n=0,p=-1;while(n<6&&(p=c._b.indexOf(t,p+1))>-1)n++;
    if(n){s+=Math.min(n,6)*0.8;hit=1;}
    if(!hit)return 0;}
  if(c.r==='reference')s*=0.8;
  s+=Math.min(c.c.length,5)*0.15+(c.q==='high'?0.2:0);
  return s;
}
function near(a,b){if(a===b)return true;if(a.length<4||Math.abs(a.length-b.length)>1)return false;var i=0,j=0,d=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue;}d++;if(d>1)return false;if(a.length>b.length)i++;else if(a.length<b.length)j++;else{i++;j++;}}return d+(a.length-i)+(b.length-j)<=1;}
var F={course:'',task:'',kind:''};
function searchCards(query){
  var terms=tok(query),phrase=query.toLowerCase().trim().replace(/\s+/g,' ');
  var list=D.cards.filter(function(c){return (!F.course||c.c.indexOf(F.course)>-1)&&(!F.task||c.k===F.task)&&(!F.kind||c.r===F.kind);});
  if(!terms.length)return {res:[],fuzzy:false};
  var res=[];list.forEach(function(c){var s=score(c,terms,phrase);if(s>0)res.push([s,c]);});
  res.sort(function(a,b){return b[0]-a[0]||(a[1].t<b[1].t?-1:1);});res=res.map(function(x){return x[1];});
  var fuzzy=false;
  if(!res.length){fuzzy=true;list.forEach(function(c){var tk=tok(c.t+' '+c.a.join(' '));if(terms.every(function(t){return tk.some(function(w){return near(t,w);});}))res.push(c);});}
  return {res:res,fuzzy:fuzzy};
}
function searchEx(query){
  var terms=tok(query);if(!terms.length)return [];
  return D.ex.filter(function(e){return (!F.course||e.co===F.course)&&terms.every(function(t){return e._x.indexOf(t)>-1;});});
}

/* ---------- pieces ---------- */
function blurb(c){var b=(c.ol||c.w||'').trim();if(!b||b.toLowerCase().replace(/\W/g,'')===c.t.toLowerCase().replace(/\W/g,''))b=(c.w&&c.w!==b)?c.w:'';return b?b.charAt(0).toUpperCase()+b.slice(1):'';}
function row(c,inSub){
  var b=blurb(c),meta=[];
  if(inSub!==true)meta.push(esc(subName(c.s)));
  if(c.r!=='concept')meta.push('<i class="kd">'+cap(c.r)+'</i>');
  if(c.x)meta.push('<i class="mk">Versions differ</i>');
  return '<a class="row" href="#c-'+c.id+'"><span class="rt">'+esc(c.t)+'</span>'+(b?'<span class="rb">'+esc(b)+'</span>':'')+
    (meta.length?'<span class="rm">'+meta.join(', ')+'</span>':'')+'</a>';
}
function rowIn(c){return row(c,true);}
function exItem(e,showCard){
  var body=(e.b||'').split(/\nsources:\s*\n/)[0].trim(),src=[],m,re=/file:\s*"([^"]+)"(?:\s*\n\s*loc:\s*"([^"]+)")?/g;
  while((m=re.exec(e.b||'')))src.push(m[1].split('/').pop()+(m[2]?' ('+m[2]+')':''));
  return '<div class="ex"><div class="exh"><b>'+esc(e.p)+'</b> <span class="cc">'+esc(e.co)+'</span>'+(showCard&&byId[e.cn]?' <span class="exc">for '+cardLink(e.cn)+'</span>':(showCard&&e.cs&&e.cs.length?' <span class="exc">uses '+e.cs.slice(0,3).map(cardLink).join(', ')+'</span>':''))+'</div>'+
    (body?'<div class="prose">'+md(body)+'</div>':'<div class="prose"><p>'+esc(cap(e.n||''))+'</p></div>')+
    (src.length?'<details class="src"><summary>Source</summary><ul>'+src.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul></details>':'')+'</div>';
}
function topbar(title,back){
  bar.innerHTML=(back?'<button class="ib" id="back" type="button" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>':'<a class="brand" href="#home">MPD² Field Reference</a>')+
    (back?'<div class="bt">'+esc(title||'')+'</div>':'<span class="grow"></span>')+
    '<a class="ib" href="#search" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></a>';
  var b=document.getElementById('back');
  if(b)b.onclick=function(){if(navCount>1)history.back();else location.hash='#home';};
}
function setNav(n){[].forEach.call(document.querySelectorAll('#bnav a'),function(a){a.classList.toggle('on',a.getAttribute('data-n')===n);a.setAttribute('aria-current',a.getAttribute('data-n')===n?'page':'false');});}

/* ---------- views ---------- */

  topbar('',false);setNav('home');
  var td=today(),rec=lsGet('recent',[]).filter(function(id){return byId[id];}).slice(0,3);
  var h='<section class="hero"><h1>What are you working on?</h1><a class="fakesearch" href="#search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Search '+D.cards.length.toLocaleString()+' concepts</a></section>';
  if(td&&td.review){
    h+='<section class="today"><div class="tbh"><span>Weekly review</span><span>Brief no. '+td.n+'</span></div><div class="tbb"><span class="tt">This week\'s concepts</span><span class="tw">Can you explain each one in a sentence? Open any you are unsure of.</span></div><div class="list flat">'+td.review.map(function(id){return row(byId[id]);}).join('')+'</div></section>';}
  else if(td){var c=td.c;
    h+='<section class="today"><div class="tbh"><span>Today\'s concept</span><span>Brief no. '+td.n+'</span></div><a class="tbb" href="#c-'+c.id+'"><span class="tt">'+esc(c.t)+'</span>'+(c.w?'<span class="tw">'+esc(c.w)+'</span>':'')+'<span class="tl">'+esc(cap(c.k))+'</span></a></section>';}
  var due=dueList().length,dk=Object.keys(deck()).length;
  if(dk)h+='<a class="revcta" href="#review"><span><b>'+(due?plural(due,'concept')+' to review':'Review is clear')+'</b><small>'+(due?'About '+Math.max(1,Math.round(due*0.5))+' min':'Next one '+fmtDay(nextDue()))+'</small></span><span class="go2">'+(due?'Start':'Library')+'</span></a>';

  h+='<h2 class="lane">Find by work task</h2><div class="tasks">';
  D.tasks.forEach(function(t){h+='<a class="task" href="#t-'+t.slug+'"><span>'+esc(t.title)+'</span><small>'+(byTask[t.slug]||[]).length+'</small></a>';});
  h+='</div><h2 class="lane">Find by course</h2><div class="courses">'+D.courses.map(function(c){return '<a href="#course-'+c.code+'">'+esc(c.code)+'</a>';}).join('')+'</div>';
  main.innerHTML=h;
}
function vSearch(){
  topbar('Search',true);setNav('search');
  var q0=sessionStorage.getItem('mpd2.q')||'';
  var to='<option value="">Any task</option>'+D.tasks.map(function(t){return '<option value="'+t.slug+'"'+(F.task===t.slug?' selected':'')+'>'+esc(t.title)+'</option>';}).join('');
  var co='<option value="">Any course</option>'+D.courses.map(function(c){return '<option value="'+c.code+'"'+(F.course===c.code?' selected':'')+'>'+esc(c.code)+'</option>';}).join('');
  var ki='<option value="">Any kind</option><option value="concept"'+(F.kind==='concept'?' selected':'')+'>Concepts</option><option value="template"'+(F.kind==='template'?' selected':'')+'>Templates</option><option value="reference"'+(F.kind==='reference'?' selected':'')+'>Reference lists</option>';
  main.innerHTML='<div class="sbox"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Try: willingness to pay, RICE, CAC" aria-label="Search" value="'+esc(q0)+'"></div>'+
    '<div class="filters"><select id="fc" aria-label="Course">'+co+'</select><select id="ft" aria-label="Task">'+to+'</select><select id="fk" aria-label="Kind">'+ki+'</select></div><div id="sres"></div>';
  var q=document.getElementById('q'),out=document.getElementById('sres'),shown=30,timer;
  function draw(){
    var v=q.value;sessionStorage.setItem('mpd2.q',v);
    if(!v.trim()){
      var rs=lsGet('searches',[]);
      out.innerHTML=(rs.length?'<h2 class="lane">Recent searches</h2><div class="recent">'+rs.map(function(s){return '<button type="button" data-s="'+esc(s)+'">'+esc(s)+'</button>';}).join('')+'</div>':'')+
        '<p class="hint">Search titles, other names and the full notes. Spelling mistakes are fine.</p>';
      [].forEach.call(out.querySelectorAll('[data-s]'),function(b){b.onclick=function(){q.value=b.getAttribute('data-s');draw();};});return;}
    var r=searchCards(v),ex=searchEx(v);
    var h='<p class="count">'+plural(r.res.length,'concept')+(r.fuzzy&&r.res.length?' (closest spelling)':'')+(ex.length?', '+plural(ex.length,'example'):'')+'</p>';
    if(!r.res.length&&!ex.length)h+='<p class="hint">Nothing matches. Try fewer words, another name for it, or clear a filter.</p>';
    if(r.res.length)h+='<div class="list">'+r.res.slice(0,shown).map(row).join('')+'</div>';
    if(r.res.length>shown)h+='<button class="more" id="more" type="button">Show '+Math.min(30,r.res.length-shown)+' more</button>';
    if(ex.length)h+='<details class="exs"><summary>Worked examples ('+ex.length+')</summary>'+ex.slice(0,20).map(function(e){return exItem(e,true);}).join('')+'</details>';
    out.innerHTML=h;var mb=document.getElementById('more');if(mb)mb.onclick=function(){shown+=30;draw();};
  }
  q.addEventListener('input',function(){clearTimeout(timer);timer=setTimeout(function(){shown=30;draw();},120);});
  q.addEventListener('change',function(){pushSearch(q.value);});
  out.addEventListener('click',function(e){if(e.target.closest('a.row'))pushSearch(q.value);});
  [['fc','course'],['ft','task'],['fk','kind']].forEach(function(p){document.getElementById(p[0]).onchange=function(e){F[p[1]]=e.target.value;shown=30;draw();};});
  draw();setTimeout(function(){q.focus();},30);
}
function vTasks(){
  topbar('Work tasks',true);setNav('tasks');
  main.innerHTML='<h1>Work tasks</h1><p class="lede">Every concept sits under the task it helps with.</p><div class="list">'+D.tasks.map(function(t){
    return '<a class="row" href="#t-'+t.slug+'"><span class="rt">'+esc(t.title)+'</span><span class="rb">'+esc(t.use.replace(/^Use this when you are\s*/i,'When you are ').replace(/^Use this when\s*/i,'When '))+'</span><span class="rm">'+plural((byTask[t.slug]||[]).length,'concept')+'</span></a>';}).join('')+'</div>';

function vTask(slug,tab){

      return '<div class="ch"><p class="sit">'+esc(r[0])+'</p><div class="go">'+r[1].map(function(id){return '<a class="start" href="#c-'+id+'">'+esc(byId[id].t)+'</a>';}).join('')+'</div>'+

      return '<details class="sub" data-s="'+s.slug+'"'+(open===s.slug?' open':'')+'><summary><span class="st">'+esc(cap(s.title))+'</span><span class="sd">'+esc(s.desc)+'</span><span class="sn">'+cs.length+'</span></summary><div class="list">'+cs.map(rowIn).join('')+'</div></details>';}).join('');

  }else{

    h+=keys.length?keys.map(function(k){return '<details class="sub"><summary><span class="st">'+esc(k)+'</span><span class="sn">'+groups[k].length+'</span></summary>'+groups[k].map(function(e){return exItem(e,true);}).join('')+'</details>';}).join(''):'<p class="hint">No worked examples filed for this task yet.</p>';

(function(){
var ITER=200000;
function b64(buf){var s='',a=new Uint8Array(buf);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function idb(){return new Promise(function(res,rej){var r=indexedDB.open('mpd2',1);r.onupgradeneeded=function(){r.result.createObjectStore('k');};r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});}
function idbGet(k){return idb().then(function(db){return new Promise(function(res){var q=db.transaction('k').objectStore('k').get(k);q.onsuccess=function(){res(q.result);};q.onerror=function(){res(null);};});}).catch(function(){return null;});}
function idbSet(k,v){return idb().then(function(db){return new Promise(function(res){var t=db.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=res;t.onerror=res;});}).catch(function(){});}
function idbDel(k){return idb().then(function(db){return new Promise(function(res){var t=db.transaction('k','readwrite');t.objectStore('k').delete(k);t.oncomplete=res;t.onerror=res;});}).catch(function(){});}
async function deriveKey(pass,salt){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);}
async function decrypt(buf,key){
  var u=new Uint8Array(buf),iv=u.slice(20,32),ct=u.slice(32);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv,additionalData:new TextEncoder().encode('MPD2')},key,ct);
  var ds=new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip')));
  return JSON.parse(await ds.text());}
async function getBuf(){
  try{var r=await fetch('data.enc',{cache:'no-cache'});if(r.ok)return await r.arrayBuffer();}catch(e){}
  var c=await caches.match('data.enc');if(c)return await c.arrayBuffer();
  throw new Error('offline and not cached yet');}
var lock=document.getElementById('lock'),msg=document.getElementById('lockmsg');
async function boot(pass){
  var buf=await getBuf(),u=new Uint8Array(buf),salt=u.slice(4,20);
  var saved=await idbGet('key');
  if(!pass&&saved&&b64(saved.salt)===b64(salt)){try{var d0=await decrypt(buf,saved.key);lock.remove();window.startApp(d0);return true;}catch(e){await idbDel('key');}}
  if(!pass)return false;
  var key=await deriveKey(pass,salt),d=await decrypt(buf,key);
  await idbSet('key',{key:key,salt:salt});
  lock.remove();window.startApp(d);return true;}

  var p=document.getElementById('pass').value;if(!p)return;msg.textContent='Unlocking...';msg.style.color='var(--mute)';
  boot(p).catch(function(err){msg.style.color='';msg.textContent=/offline/.test(err.message)?'You are offline and the data is not downloaded yet. Connect once, then try again.':'That passphrase did not work. Check it and try again.';});});

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
boot(null).then(function(ok){if(!ok)document.getElementById('pass').focus();}).catch(function(){});
})();
